<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>차곡</title>
  <!-- PWA: 폰 홈 화면에 설치하고, 인터넷이 끊겨도 열리게 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#faf6f0" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="차곡" />
  <script>
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
    // 인트로: 앱을 새로 열 때만 보여요. 앱 안에서 다른 화면을 다녀오면 보이지 않아요.
    // (sessionStorage는 앱을 닫으면 비워지는 임시 메모장이에요)
    (function () {
      let seen = false;
      try { seen = sessionStorage.getItem("chagok.splash") === "1"; sessionStorage.setItem("chagok.splash", "1"); } catch (e) {}
      if (!seen) document.documentElement.classList.add("splash-on");
    })();
  </script>
  <!-- 글꼴을 미리 불러와서, 기본 글씨체가 잠깐 보였다 바뀌는 깜빡임을 막아요 -->
  <link rel="preload" href="fonts/GowunDodum-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* 색·글꼴은 theme.css에서 모든 화면이 함께 써요 */
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 28px 18px 120px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    /* 위쪽 줄은 스크롤해도 붙어 있어서, "도움받을 곳"이 언제나 한 번에 닿아요 */
    .head {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 5;
      background: var(--bg);
      margin: -28px -18px 4px; padding: 20px 18px 8px;
    }
    .head h1 { margin: 0; }
    .sub { color: var(--soft); margin: 0 0 12px; font-size: 0.95rem; }
    /* 털어놓기·구급상자: 나란히 두어 한 번에 닿게 */
    .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 22px; }
    .vent-link.kit-link { background: var(--card); }
    .vent-link {
      display: block; padding: 14px 16px; line-height: 1.45;
      background: var(--accent-soft); color: var(--text);
      border-radius: 16px; text-decoration: none; font-size: 0.95rem;
    }
    .look-link {
      display: block; margin: 40px 0 0; padding: 14px 18px; text-align: center;
      background: var(--card); border-radius: var(--radius);
      color: var(--soft); text-decoration: none; font-size: 0.95rem;
    }

    .people-link { margin-top: 10px; }
    .backup-link {
      display: block; width: fit-content; margin: 18px auto 0; padding: 6px 4px;
      color: var(--soft); font-size: 0.85rem;
      text-decoration: underline; text-underline-offset: 3px;
    }

    /* 오늘 기분: 날씨 그림으로 한 번에 */
    .mood { background: var(--card); border-radius: 20px; padding: 14px 12px 12px; margin: 6px 0 14px; }
    .mood-q { margin: 0 6px 10px; font-size: 1rem; }
    /* 날씨 버튼이 그려지기 전에도 같은 높이를 차지해서, 아래 내용이 밀려 내려가지 않게 */
    .mood-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; min-height: 83px; }
    .mood-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font: inherit; font-size: 0.8rem; color: var(--soft); cursor: pointer;
      border: none; background: none; border-radius: 14px; padding: 6px 2px 6px;
      transition: background .25s ease, transform .15s ease;
    }
    .mood-btn svg { width: 48px; height: 48px; }
    .mood-btn:active { transform: scale(0.95); }
    .mood-btn[aria-pressed="true"] { background: var(--bg); color: var(--text); }
    .mood-btn:focus-visible { outline: 2px solid var(--soft); outline-offset: 1px; }
    .mood-note { color: var(--accent-deep); font-size: 0.85rem; min-height: 1.4em; margin: 6px 6px 0; }

    /* 낮은 날: 부드럽게 펼쳐지는 작은 자리 */
    .low { margin-top: 10px; background: var(--bg); border-radius: 16px; padding: 14px 14px 12px; animation: lowIn .45s ease; }
    .low[hidden] { display: none; }
    .low.instant { animation: none; }
    @keyframes lowIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .low-hello { margin: 0 0 12px; font-size: 0.95rem; }
    .note-card { background: var(--peach); border-radius: 14px; padding: 14px 16px 10px; }
    .note-card .from { color: var(--accent-deep); font-size: 0.8rem; margin: 0 0 4px; }
    .note-card .text { font-size: 1.1rem; margin: 0; }
    .low-row { display: flex; justify-content: flex-end; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .low-btn {
      font: inherit; font-size: 0.88rem; cursor: pointer; border: none; border-radius: 12px;
      padding: 7px 12px; background: none; color: var(--soft); white-space: nowrap;
    }
    .low-btn.did-it { background: var(--bg); color: var(--accent-deep); }
    .low-btn.done, .lie-btn.done { color: var(--accent-deep); }
    .low-sub { color: var(--soft); font-size: 0.85rem; margin: 14px 2px 8px; }
    .lie-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
    .lie-btn {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
      font: inherit; font-size: 0.98rem; color: var(--text); text-align: left; cursor: pointer;
      border: none; border-radius: 12px; padding: 11px 14px; background: var(--card);
    }
    .lie-btn:active { background: var(--card-press); }
    .lie-btn small { color: var(--faint); font-size: 0.8rem; white-space: nowrap; }
    .lie-btn.done { background: var(--peach); }
    .lie-btn.done small { color: var(--accent-deep); }
    .low-more { display: block; margin: 8px 2px 0; }
    .low-next {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 0.88rem; color: var(--soft);
    }
    .low-next a { color: var(--text); text-decoration: none; background: var(--accent-soft); border-radius: 999px; padding: 7px 14px; white-space: nowrap; }
    .low-next .end { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    /* 비가 와요: 쉬어 가기 */
    .rest-btn {
      display: block; width: 100%; font: inherit; font-size: 1.08rem; cursor: pointer; text-align: center;
      border: none; border-radius: 16px; padding: 18px 16px; background: var(--peach); color: var(--text);
    }
    .rest-btn:active { transform: scale(0.98); }
    .rest-done { background: var(--card); border-radius: 16px; padding: 14px 16px; text-align: center; }
    .rest-done p { margin: 0; }
    .rest-done small { display: block; color: var(--soft); font-size: 0.85rem; margin-top: 2px; }
    .rest-done .low-btn { margin-top: 4px; font-size: 0.82rem; }
    .past { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
    .past .from { color: var(--soft); font-size: 0.8rem; margin: 0 0 4px; }
    .past p { margin: 0; }
    .past .fact { font-size: 1.02rem; }
    .past .sub-fact { color: var(--soft); font-size: 0.88rem; margin-top: 4px; }
    /* 흐려요: 조금만 움직이면 되는 일 */
    .move-card { background: var(--card); border-radius: 14px; padding: 14px 16px 10px; margin-top: 10px; }
    .move-card .from { color: var(--soft); font-size: 0.8rem; margin: 0 0 4px; }
    .move-card .text { font-size: 1.08rem; margin: 0; }
    .move-card .low-btn.did-it { background: var(--bg); }
    #lowHelp[hidden] { display: none; }
    .low-person { margin-top: 14px; }
    .low-person[hidden] { display: none; }
    .low-person .ppl-hint { background: var(--card); }
    @media (prefers-reduced-motion: reduce) { .low { animation: none; } }

    /* 항목 목록 */
    .items { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 10px; }
    .item {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      background: var(--card);
      border: none;
      border-radius: var(--radius);
      padding: 17px 18px;
      font: inherit; color: inherit; text-align: left;
      cursor: pointer;
      transition: transform .15s ease, background .3s ease;
    }
    .item:active { transform: scale(0.98); background: var(--card-press); }
    .item .name { flex: 1; font-size: 1.08rem; }
    .item .count { color: var(--soft); font-size: 0.88rem; white-space: nowrap; }
    /* 해낸 항목: 조약돌 같은 복숭아·살구 톤 */
    .item.did { background: var(--peach); }
    .item.did:active { background: #f1cdb2; }
    .item.did .count { color: var(--accent-deep); }
    .item.did .count::before {
      content: ""; display: inline-block; width: 12px; height: 9px; margin-right: 6px;
      border-radius: 50%; background: var(--pebble-1); vertical-align: 1px;
    }
    .item.pop { animation: pop .45s ease; }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .del {
      border: none; background: none; color: var(--soft);
      font-size: 0.85rem; padding: 4px 8px; cursor: pointer;
      display: none;
    }
    .editing .del { display: inline-block; }
    .editing .item { cursor: default; }

    .empty {
      color: var(--soft); text-align: center;
      padding: 24px 12px; font-size: 0.95rem;
    }

    /* 항목 추가 */
    .add { display: flex; gap: 8px; margin-bottom: 8px; }
    .add input {
      flex: 1; min-width: 0; font: inherit; color: inherit;
      padding: 14px 16px;
      border: 1.5px solid transparent; border-radius: 14px;
      background: var(--card); outline: none;
    }
    .add input::placeholder { color: var(--faint); }
    .add input:focus { border-color: var(--accent); background: var(--bg); }
    .add button {
      font: inherit; border: none; border-radius: 14px;
      padding: 0 20px; background: var(--accent); color: #fff;
      cursor: pointer;
      white-space: nowrap; flex-shrink: 0;   /* "추가"가 두 줄로 깨지지 않게 */
    }
    .tools { text-align: right; }
    .link {
      border: none; background: none; color: var(--soft);
      font: inherit; font-size: 0.85rem; cursor: pointer; padding: 6px 4px;
      text-decoration: underline; text-underline-offset: 3px;
    }

    /* 오늘 기록 */
    h2 { font-size: 1.05rem; margin: 32px 0 10px; }
    .log { list-style: none; padding: 0; margin: 0; }
    .log li {
      display: flex; gap: 10px; padding: 10px 2px;
      border-bottom: 1px solid var(--line); font-size: 0.95rem;
    }
    .log time { color: var(--soft); min-width: 3.5em; }

    /* 아래쪽 안내 (되돌리기) */
    .toast {
      position: fixed; left: 50%; bottom: 24px;
      transform: translate(-50%, 20px);
      background: #5a4e45; color: #fff;
      padding: 12px 16px; border-radius: 14px;
      display: flex; gap: 14px; align-items: center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      max-width: calc(100% - 32px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast button {
      border: none; background: none; color: var(--accent-soft);
      font: inherit; text-decoration: underline; cursor: pointer; padding: 0;
      white-space: nowrap;
    }
    .toast { flex-wrap: wrap; width: 440px; }
    .toast #toastText { flex: 1; min-width: 0; }
    .memo-form { display: none; width: 100%; gap: 8px; }
    .toast.memo .memo-form { display: flex; }
    .toast.memo .toast-actions { display: none; }
    .toast-actions { display: flex; gap: 14px; }
    .memo-form input {
      flex: 1; min-width: 0; font: inherit; color: var(--text);
      padding: 10px 12px; border: none; border-radius: 10px; outline: none;
    }
    .memo-form button { text-decoration: none; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 14px; }
    .log .memo { display: block; color: var(--soft); font-size: 0.88rem; }
    .log .memo.hint { color: var(--faint); font-size: 0.8rem; }
    .log .entry { flex: 1; min-width: 0; }
    .log li.tappable { cursor: pointer; border-radius: 8px; }
    .log li.tappable:active { background: var(--accent-soft); }
    .log li.tappable:focus-visible { outline: 2px solid var(--soft); outline-offset: 2px; }

    /* 인트로 */
    .splash { display: none; }
    .splash-on .splash {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg); cursor: pointer;
      transition: opacity .45s ease;
    }
    .splash svg { width: 96px; height: 96px; }
    .splash .name { font-size: 1.7rem; letter-spacing: 0.1em; color: var(--text); }
    .splash rect { animation: settle .5s cubic-bezier(.3, 1.3, .5, 1) both; }
    .splash rect:nth-child(2) { animation-delay: .08s; }
    .splash rect:nth-child(3) { animation-delay: .16s; }
    .splash .name { animation: rise .45s ease .1s both; }
    @keyframes settle { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .splash.leaving { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      .splash-on .splash { transition: none; }
      .splash rect, .splash .name { animation: none; }
    }
  </style>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <svg viewBox="120 120 272 272" role="img">
      <rect x="120" y="297" width="272" height="76" rx="30" fill="#e09a6b"/>
      <rect x="156" y="215" width="216" height="70" rx="28" fill="#e8a87c"/>
      <rect x="172" y="139" width="156" height="64" rx="26" fill="#f2c4a0"/>
    </svg>
    <div class="name">차곡</div>
  </div>
  <main>
    <div class="head">
      <h1>오늘 해낸 일</h1>
      <span data-help-slot></span>
    </div>
    <section class="mood" aria-labelledby="moodQ">
      <p class="mood-q" id="moodQ">오늘 기분은 어때요?</p>
      <div class="mood-row" id="moodRow"></div>
      <p class="mood-note" id="moodNote" role="status"></p>

      <!-- 기분이 낮은 날에만 조용히 펼쳐져요 -->
      <div class="low" id="low" hidden>
        <p class="low-hello" id="lowHello"></p>
        <div id="lowRest"></div>   <!-- 비가 와요: 쉬어 가기 -->
        <div id="lowPast"></div>   <!-- 비가 와요: 과거의 내가 해낸 것 -->
        <div id="lowNote"></div>   <!-- 흐려요: 구급상자 쪽지 -->
        <div id="lowMove"></div>   <!-- 흐려요: 조금만 움직이면 되는 일 -->
        <div class="low-person" id="lowPerson" hidden></div>
        <div class="low-next">
          <span id="lowNextLabel">마음이 무거우면</span>
          <span class="end">
            <a href="vent.html">털어놓기</a>
            <span id="lowHelp"><span data-help-slot></span></span>
          </span>
        </div>
        <div id="lowLie"></div>    <!-- 비가 와요: 맨 아래 "원하면" -->
        <div class="low-row"><button class="low-btn" id="lowClose" type="button">접어 두기</button></div>
      </div>
    </section>

    <p class="sub">해낸 일을 탭하면 기록돼요. 작은 것도 충분해요.</p>
    <div class="quick">
      <a class="vent-link" href="vent.html">털어놓고 싶을 땐<br>여기로 →</a>
      <a class="vent-link kit-link" href="kit.html">힘들 땐<br>나의 구급상자 →</a>
    </div>

    <ul class="items" id="items"></ul>

    <form class="add" id="addForm" autocomplete="off">
      <input id="addInput" maxlength="40" placeholder="예: 물 한 잔 마시기, 창문 열기" />
      <button type="submit">추가</button>
    </form>
    <div class="tools">
      <button class="link" id="editBtn" type="button">항목 정리하기</button>
    </div>

    <h2 id="logTitle">오늘 내가 해낸 것</h2>
    <ul class="log" id="log"></ul>

    <a class="look-link" href="lookback.html">이번 주 돌아보기 →</a>
    <a class="look-link people-link" href="people.html">털어놓을 수 있는 사람 →</a>
    <a class="backup-link" href="backup.html">내 기록 백업하기</a>
  </main>

  <div class="toast" id="toast" role="status">
    <span id="toastText"></span>
    <span class="toast-actions">
      <button id="memoBtn" type="button">한 줄 남기기</button>
      <button id="undoBtn" type="button">되돌리기</button>
    </span>
    <form class="memo-form" id="memoForm" autocomplete="off">
      <input id="memoInput" maxlength="80" placeholder="한 줄 남겨도 좋아요 (선택)" />
      <button type="submit">남기기</button>
    </form>
  </div>

  <script src="help.js"></script>
  <script src="record-sheet.js"></script>
  <script src="people.js"></script>
  <script src="mood.js"></script>
  <script>
    // ── 저장소: 데이터는 이 브라우저 안(localStorage)에만 저장돼요 ──
    const KEY = "overcome.v1";

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(KEY));
        if (data && Array.isArray(data.items) && Array.isArray(data.records)) return data;
      } catch (e) {}
      return { items: [], records: [] };
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }

    let state = load();
    let editing = false;
    let lastRecordId = null;
    let toastTimer = null;

    const $ = (id) => document.getElementById(id);
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    // 오늘 날짜(내 기기 시간 기준)인지 확인
    function isToday(iso) {
      const d = new Date(iso), n = new Date();
      return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    }
    const todayRecords = () => state.records.filter((r) => isToday(r.at));

    function render() {
      const today = todayRecords();
      const list = $("items");
      list.innerHTML = "";
      list.parentElement.classList.toggle("editing", editing);

      if (state.items.length === 0) {
        list.innerHTML = '<li class="empty">아래에 내가 해내고 싶은 작은 일을 적어 보세요.</li>';
      }

      state.items.forEach((item) => {
        const n = today.filter((r) => r.itemId === item.id).length;
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "item" + (n > 0 ? " did" : "");
        btn.dataset.id = item.id;

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = item.name;
        btn.appendChild(name);

        const count = document.createElement("span");
        count.className = "count";
        count.textContent = n === 0 ? "" : n === 1 ? "내가 해냈다" : `내가 해냈다 ×${n}`;
        btn.appendChild(count);

        const del = document.createElement("span");
        del.className = "del";
        del.textContent = "빼기";
        del.setAttribute("role", "button");
        btn.appendChild(del);

        btn.addEventListener("click", (e) => {
          if (editing) {
            if (e.target === del) removeItem(item.id);
            return;
          }
          record(item, btn);
        });

        li.appendChild(btn);
        list.appendChild(li);
      });

      $("editBtn").textContent = editing ? "다 정리했어요" : "항목 정리하기";
      $("editBtn").style.display = state.items.length ? "" : "none";

      // 오늘 기록 모아 보기 (최신순)
      const log = $("log");
      log.innerHTML = "";
      $("logTitle").textContent = today.length
        ? `오늘 내가 해낸 것 · ${today.length}가지`
        : "오늘 내가 해낸 것";
      if (today.length === 0) {
        log.innerHTML = '<li class="empty" style="border:none;justify-content:center">해낸 일이 생기면 여기에 쌓여요.</li>';
      }
      [...today].reverse().forEach((r) => {
        const li = document.createElement("li");
        const t = document.createElement("time");
        t.textContent = new Date(r.at).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
        const s = document.createElement("span");
        s.className = "entry";
        s.textContent = r.name;

        const m = document.createElement("span");
        m.className = "memo" + (r.memo ? "" : " hint");
        m.textContent = r.memo || "탭해서 한 줄 남기기";
        s.appendChild(m);
        // 탭하면 작은 창이 열려요: 메모 쓰기·고치기, 잘못 누른 기록 빼기
        li.className = "tappable";
        li.tabIndex = 0;
        li.setAttribute("role", "button");
        const open = () => openRecordSheet(r.id, () => { state = load(); render(); });
        li.addEventListener("click", open);
        li.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
        li.append(t, s);
        log.appendChild(li);
      });
    }

    function record(item, btn) {
      const r = { id: uid(), itemId: item.id, name: item.name, at: new Date().toISOString() };
      state.records.push(r);
      save();
      lastRecordId = r.id;
      lastLooseBtn = null;
      render();
      const fresh = document.querySelector(`.item[data-id="${item.id}"]`);
      if (fresh) fresh.classList.add("pop");
      showToast(`"${item.name}" 내가 해냈어요`);
    }

    function undo() {
      if (!lastRecordId) return;
      state.records = state.records.filter((r) => r.id !== lastRecordId);
      lastRecordId = null;
      save();
      render();
      hideToast();
      // 낮은 날 자리에서 기록한 거라면, 그 버튼도 원래대로
      if (lastLooseBtn) { resetLoose(lastLooseBtn); lastLooseBtn = null; }
    }

    function removeItem(id) {
      const item = state.items.find((i) => i.id === id);
      if (!item || !confirm(`"${item.name}" 항목을 목록에서 뺄까요?\n지금까지 해낸 기록은 그대로 남아요.`)) return;
      state.items = state.items.filter((i) => i.id !== id);
      save();
      render();
    }

    function showToast(text) {
      $("toastText").textContent = text;
      $("toast").classList.remove("memo");
      $("toast").classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 5000);
    }
    function hideToast() { $("toast").classList.remove("show", "memo"); }

    // 한 줄 메모: 기록은 이미 됐고, 원할 때만 덧붙여요
    function openMemo() {
      if (!lastRecordId) return;
      clearTimeout(toastTimer);           // 쓰는 동안엔 사라지지 않게
      $("memoInput").value = "";
      $("toast").classList.add("memo");
      $("memoInput").focus();
    }
    $("memoForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = $("memoInput").value.trim();
      const r = state.records.find((x) => x.id === lastRecordId);
      if (r && text) { r.memo = text; save(); render(); }
      $("memoInput").blur();
      hideToast();
    });
    $("memoInput").addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideToast();
    });
    $("memoBtn").addEventListener("click", openMemo);

    $("addForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("addInput").value.trim();
      if (!name) return;
      state.items.push({ id: uid(), name });
      save();
      $("addInput").value = "";
      render();
    });
    $("editBtn").addEventListener("click", () => { editing = !editing; render(); });
    $("undoBtn").addEventListener("click", undo);

    render();

    // ── 오늘 기분: 탭 한 번으로 남겨요. 그래프나 통계는 만들지 않아요. ──
    // 모양: [{ id, at, level }]  level 4 맑아요 · 3 구름 조금 · 2 흐려요 · 1 비가 와요
    const MOOD_KEY = window.chagokMood.KEY;
    const MOODS = window.chagokMood.MOODS;   // 날씨 그림은 mood.js에 있어요 (돌아보기와 함께 써요)
    const KIT_KEY = "chagok.kit.v1";
    const LOW_HELLO = {
      2: "흐린 날이네요. 오늘은 천천히 가도 괜찮아요.",
      1: "오늘은 그냥 누워 있어도 괜찮아요. 쉬는 것도 나를 돌보는 일이에요.",
    };
    const MOVES = ["창문 열기", "세수하기", "집 앞 5분 걷기", "물 한 컵 마시기", "이불 정리하기", "양치하기", "햇빛 드는 곳에 잠깐 서 있기"];
    const LIE_DOWN = ["숨 세 번 천천히 쉬기", "물 한 모금 마시기", "창밖 잠깐 보기", "이불 속에서 기지개 켜기", "좋아하는 노래 한 곡 듣기"];
    // 쉬어 가기로 한 날: 시간만 남겨요 (돌아보기에 조용히 조약돌 하나). 모양: [{ id, at }]
    const REST_KEY = "chagok.rest.v1";
    const VENTED_KEY = "chagok.vented.v1";

    const readList = (key) => { try { const v = JSON.parse(localStorage.getItem(key)); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
    const writeList = (key, list) => { try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {} };
    const todayMood = () => readList(MOOD_KEY).filter((m) => isToday(m.at)).pop() || null;
    const kitCards = () => readList(KIT_KEY).filter((c) => c && c.text);
    const pickOne = (arr, notThis) => { const pool = arr.length > 1 ? arr.filter((x) => x !== notThis) : arr; return pool[Math.floor(Math.random() * pool.length)]; };

    function renderMood() {
      const cur = todayMood();
      const row = $("moodRow");
      row.innerHTML = "";
      for (const m of MOODS) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "mood-btn";
        b.setAttribute("aria-pressed", cur && cur.level === m.level ? "true" : "false");
        b.innerHTML = `${window.chagokMood.svg(m.level)}<span>${m.label}</span>`;
        b.addEventListener("click", () => pickMood(m.level));
        row.appendChild(b);
      }
    }

    let noteTimer = null;
    function pickMood(level) {
      const list = readList(MOOD_KEY);
      const last = list[list.length - 1];
      // 방금(2분 안) 고른 걸 바꾸면 새로 쌓지 않고 고쳐요: 잘못 누른 것도 괜찮아요
      if (last && Date.now() - new Date(last.at).getTime() < 120000) { last.level = level; last.at = new Date().toISOString(); }
      else list.push({ id: uid(), at: new Date().toISOString(), level });
      writeList(MOOD_KEY, list);
      renderMood();
      clearTimeout(noteTimer);
      if (level <= 2) {
        $("moodNote").textContent = "";
        openLow(level);
      } else {
        $("low").hidden = true;
        clearLow();
        $("moodNote").textContent = "오늘의 기분을 남겨 뒀어요.";
        noteTimer = setTimeout(() => { $("moodNote").textContent = ""; }, 3000);
      }
    }

    // 낮은 날
    //  흐려요:   구급상자 쪽지 → 조금만 움직이면 되는 일 → 털어놓기(가볍게)
    //  비가 와요: 쉬어 가기 → 과거의 내가 해낸 것 → 털어놓기·사람·도움받을 곳 → (원하면) 누워서도 할 수 있는 일
    // 펼친 자리의 모습(무슨 쪽지·어떤 일·누구를 보여 줬는지)을 잠깐 기억해 둬요.
    // 다른 화면에 다녀와 홈이 다시 그려져도, 처음부터 같은 모습·같은 길이로 그려져서 스크롤이 튀지 않아요.
    // (sessionStorage: 앱을 닫으면 비워지는 임시 메모장)
    const LOW_KEY = "chagok.low";
    let lowState = null;
    function saveLow(patch) {
      lowState = { ...(lowState || {}), ...patch, day: new Date().toDateString() };
      try { sessionStorage.setItem(LOW_KEY, JSON.stringify(lowState)); } catch (e) {}
    }
    function clearLow() {
      lowState = null;
      try { sessionStorage.removeItem(LOW_KEY); } catch (e) {}
    }
    function savedLow() {
      try {
        const v = JSON.parse(sessionStorage.getItem(LOW_KEY));
        const cur = todayMood();
        if (v && v.day === new Date().toDateString() && cur && cur.level === v.level && v.level <= 2) return v;
      } catch (e) {}
      return null;
    }

    // restore가 있으면: 아까와 같은 내용으로, 움직임 없이 바로 그려요
    function openLow(level, restore = null) {
      ["lowRest", "lowPast", "lowNote", "lowMove", "lowLie"].forEach((id) => { $(id).innerHTML = ""; });
      $("lowPerson").hidden = true;
      $("low").classList.toggle("instant", !!restore);
      lowState = { level };
      saveLow({ level });
      $("lowHello").textContent = LOW_HELLO[level];
      const cards = kitCards();
      if (level === 2) {
        if (cards.length) showNote(cards, restore && restore.noteId);
        showMove(restore && restore.move);
        $("lowNextLabel").textContent = "털어놓고 싶으면";
        $("lowHelp").hidden = true;
      } else {
        showRest();
        showPast();
        // 목록이 비어 있으면 적어 둘 수 있다고만 살짝
        window.chagokPeople.suggest($("lowPerson"), { preferId: restore && restore.personId, onPick: (id) => saveLow({ personId: id }) });
        $("lowNextLabel").textContent = "마음이 무거우면";
        $("lowHelp").hidden = false;
        showLie(!!(restore && restore.lieOpen), "원하면, 누워서도 할 수 있는 일");
        if (restore && restore.lieOpen) saveLow({ lieOpen: true });
      }
      $("low").hidden = false;
    }

    let shownNoteId = null;
    function showNote(cards, preferId) {
      const pool = cards.length > 1 ? cards.filter((x) => x.id !== shownNoteId) : cards;
      const card = cards.find((x) => x.id === preferId) || pool[Math.floor(Math.random() * pool.length)];
      shownNoteId = card.id;
      saveLow({ noteId: card.id });
      const box = $("lowNote");
      box.innerHTML = `
        <div class="note-card">
          <p class="from">과거의 내가 지금의 나에게</p>
          <p class="text"></p>
          <div class="low-row">
            ${cards.length > 1 ? '<button class="low-btn" type="button" data-act="other">다른 쪽지</button>' : ""}
            <button class="low-btn did-it" type="button" data-act="did" data-label="해 봤어요">해 봤어요</button>
          </div>
        </div>`;
      box.querySelector(".text").textContent = card.text;
      box.querySelector('[data-act="did"]').addEventListener("click", (e) => recordLoose(card.text, e.currentTarget));
      const other = box.querySelector('[data-act="other"]');
      if (other) other.addEventListener("click", () => showNote(kitCards()));
    }

    // 흐려요: 조금만 움직이면 되는 일, 하나만
    let shownMove = null;
    function showMove(prefer) {
      shownMove = MOVES.includes(prefer) ? prefer : pickOne(MOVES, shownMove);
      saveLow({ move: shownMove });
      const box = $("lowMove");
      box.innerHTML = `
        <div class="move-card">
          <p class="from">조금만 움직이면 되는 일</p>
          <p class="text"></p>
          <div class="low-row">
            <button class="low-btn" type="button" data-act="other">다른 것</button>
            <button class="low-btn did-it" type="button" data-act="did" data-label="해냈어요">해냈어요</button>
          </div>
        </div>`;
      const name = shownMove;
      box.querySelector(".text").textContent = name;
      box.querySelector('[data-act="did"]').addEventListener("click", (e) => recordLoose(name, e.currentTarget));
      box.querySelector('[data-act="other"]').addEventListener("click", () => showMove());
    }

    // 비가 와요: 쉬어 가기로 한 것도 내가 고른 일이에요
    const todayRest = () => readList(REST_KEY).find((r) => r && isToday(r.at)) || null;
    function showRest() {
      const box = $("lowRest");
      const rest = todayRest();
      if (!rest) {
        box.innerHTML = '<button class="rest-btn" type="button">오늘은 쉬어 가기로 했어요</button>';
        box.querySelector("button").addEventListener("click", () => {
          const list = readList(REST_KEY);
          list.push({ id: uid(), at: new Date().toISOString() });
          writeList(REST_KEY, list);
          showRest();
          showPast();
        });
        return;
      }
      box.innerHTML = `
        <div class="rest-done" role="status">
          <p>오늘은 쉬어 가기로 했어요.</p>
          <small>돌아보기에 조약돌 하나를 조용히 놓아 뒀어요.</small>
          <button class="low-btn" type="button">되돌리기</button>
        </div>`;
      box.querySelector("button").addEventListener("click", () => {
        writeList(REST_KEY, readList(REST_KEY).filter((r) => r.id !== rest.id));
        showRest();
        showPast();
      });
    }

    // 비가 와요: 과거의 내가 해낸 것 (칭찬·평가 없이 사실만)
    function showPast() {
      const box = $("lowPast");
      const records = load().records;
      const total = records.length + readList(VENTED_KEY).length + readList(REST_KEY).length;
      // 날짜는 줄바꿈되지 않게 (11월 / 10일로 갈라지지 않도록)
      const fmt = (iso) => new Date(iso).toLocaleDateString("ko-KR", { month: "long", day: "numeric" }).replace(/ /g, " ");
      box.innerHTML = "";
      const wrap = document.createElement("div");
      wrap.className = "past";
      const add = (cls, text) => { const p = document.createElement("p"); p.className = cls; p.textContent = text; wrap.appendChild(p); };
      if (total > 0) {
        add("from", "과거의 내가 해낸 것");
        add("fact", `지금까지 쌓인 조약돌 ${total}개`);
        const lastDone = [...records].sort((a, b) => new Date(a.at) - new Date(b.at)).pop();
        if (lastDone) add("sub-fact", `가장 최근에 해낸 일: ${lastDone.name} · ${fmt(lastDone.at)}`);
      } else {
        const cards = kitCards();
        if (!cards.length) return;   // 보여 줄 사실이 없으면 비워 둬요
        const c = cards[Math.floor(Math.random() * cards.length)];
        add("from", "과거의 내가 남긴 쪽지");
        add("fact", c.text);
        add("sub-fact", `${fmt(c.at)}에 적어 둔 거예요`);
      }
      box.appendChild(wrap);
    }

    // open=false면 링크만 보여요
    function showLie(open, label = "누워서도 할 수 있는 일 보기") {
      const box = $("lowLie");
      if (!open) {
        box.innerHTML = '<button class="link low-more" type="button"></button>';
        box.querySelector("button").textContent = label;
        box.querySelector("button").addEventListener("click", () => { showLie(true); saveLow({ lieOpen: true }); });
        return;
      }
      box.innerHTML = '<p class="low-sub">누워서도 할 수 있는 일. 하고 싶을 때만요.</p><ul class="lie-list"></ul>';
      const ul = box.querySelector("ul");
      for (const name of LIE_DOWN) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "lie-btn";
        b.innerHTML = "<span></span><small>했다면 탭</small>";
        b.querySelector("span").textContent = name;
        b.addEventListener("click", () => recordLoose(name, b));
        li.appendChild(b);
        ul.appendChild(li);
      }
    }

    // 목록 항목이 아닌 일도 해낸 일로 기록해요 ("오늘 내가 해낸 것"과 돌아보기에 함께 쌓여요)
    function recordLoose(name, btn) {
      if (btn.classList.contains("done")) return;
      const r = { id: uid(), name, at: new Date().toISOString() };
      state.records.push(r);
      save();
      lastRecordId = r.id;
      render();
      lastLooseBtn = btn;
      btn.classList.add("done");
      const tag = btn.querySelector("small");
      if (tag) tag.textContent = "내가 해냈다"; else btn.textContent = "내가 해냈어요";
      showToast(`"${name}" 내가 해냈어요`);
    }
    let lastLooseBtn = null;
    function resetLoose(btn) {
      btn.classList.remove("done");
      const tag = btn.querySelector("small");
      if (tag) tag.textContent = "했다면 탭"; else btn.textContent = btn.dataset.label || "해 봤어요";
    }
    $("lowClose").addEventListener("click", () => { $("low").hidden = true; clearLow(); });

    renderMood();
    // 아까 펼쳐 둔 자리가 있으면, 처음 그릴 때부터 같은 모습으로 (늦게 펼쳐지며 길이가 바뀌지 않게)
    (function () { const v = savedLow(); if (v) openLow(v.level, v); })();

    // 뒤로 와서 폰이 기억해 둔 홈(back-forward cache)이 그대로 돌아왔을 때:
    // 새로 불러오지 않고, 그사이 바뀐 기록·기분만 조용히 최신으로 바꿔요.
    //  - 아무것도 바뀌지 않았다면 손대지 않아요 (그러면 길이도 그대로라 화면이 밀릴 일이 없어요)
    //  - 바뀌었다면, 지금 보고 있던 자리가 화면에서 그대로 있도록 스크롤을 맞춰요
    // 스크롤 위치는 아이폰이 기억해요 (예전에 잠깐 "manual"로 바꿨던 것을 확실히 되돌려요)
    try { history.scrollRestoration = "auto"; } catch (e) {}

    const WATCH_KEYS = [KEY, MOOD_KEY, KIT_KEY, REST_KEY, VENTED_KEY, "chagok.people.v1"];
    const snapshot = () => new Date().toDateString() + "|" + WATCH_KEYS.map((k) => { try { return localStorage.getItem(k); } catch (e) { return ""; } }).join("|");
    let lastSnapshot = snapshot();
    addEventListener("pagehide", () => { lastSnapshot = snapshot(); });

    // 다시 그려지지 않는(늘 그 자리에 있는) 것들 중에서, 지금 화면에 보이는 것 하나를 기준으로 삼아요
    function keepPlace(update) {
      const marks = [...document.querySelectorAll("#moodQ, main > .sub, .quick, #addForm, .tools, #logTitle, .look-link, .backup-link")];
      const mark = marks.find((el) => el.getBoundingClientRect().top >= 0) || marks[marks.length - 1];
      const before = mark ? mark.getBoundingClientRect().top : 0;
      update();
      if (mark) {
        const diff = mark.getBoundingClientRect().top - before;
        if (Math.abs(diff) >= 1) scrollBy(0, diff);
      }
    }

    addEventListener("pageshow", (e) => {
      if (!e.persisted) return;
      hideToast();
      const now = snapshot();
      if (now === lastSnapshot) return;   // 바뀐 게 없으면 그대로
      lastSnapshot = now;
      keepPlace(() => {
        state = load();
        render();
        renderMood();
        const v = savedLow();
        if (v) openLow(v.level, v);
        else if (!$("low").hidden && !(todayMood() && todayMood().level <= 2)) { $("low").hidden = true; clearLow(); }
      });
    });

    // 인트로 걷기: 1초 안쪽에 부드럽게 사라지고, 탭하면 바로 넘어가요
    (function () {
      const splash = $("splash");
      if (!document.documentElement.classList.contains("splash-on")) { splash.remove(); return; }
      const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let gone = false;
      const finish = () => { splash.remove(); document.documentElement.classList.remove("splash-on"); };
      const leave = (quick) => {
        if (gone) return;
        gone = true;
        if (calm) { finish(); return; }                 // 움직임 줄이기: 그냥 사라져요
        if (quick) splash.style.transitionDuration = "0.15s";
        splash.classList.add("leaving");
        setTimeout(finish, quick ? 200 : 500);
      };
      splash.addEventListener("pointerdown", () => leave(true));
      setTimeout(() => leave(false), calm ? 400 : 850); // 보통: 0.85초 보이고 0.45초 사라짐
    })();
  </script>
</body>
</html>
