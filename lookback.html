<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>돌아보기 · 차곡</title>
  <!-- PWA: 폰 홈 화면에 설치하고, 인터넷이 끊겨도 열리게 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#faf6f0" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="차곡" />
  <script>
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
  <!-- 글꼴을 미리 불러와서, 기본 글씨체가 잠깐 보였다 바뀌는 깜빡임을 막아요 -->
  <link rel="preload" href="fonts/GowunDodum-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* 색·글꼴은 theme.css에서 모든 화면이 함께 써요 */
    main { max-width: 480px; margin: 0 auto; padding: calc(var(--bar-h) + env(safe-area-inset-top)) 18px 60px; }

    /* 위쪽 줄은 스크롤해도 붙어 있어서, "도움받을 곳"이 언제나 한 번에 닿아요 */
    .top {
      display: flex; justify-content: space-between; align-items: center; min-height: 36px;
      /* 화면 위에 고정 (theme.css의 .fixed-bar) */
    }
    .link { color: var(--soft); font-size: 0.9rem; text-decoration: none; padding: 6px 2px; }
    .link:hover, .link:focus-visible { color: var(--text); }

    h1 { font-size: 1.6rem; margin: 14px 0 2px; }
    .range { color: var(--soft); font-size: 0.9rem; margin: 0 0 18px; }

    /* 조약돌이 쌓이는 곳 */
    .pile-wrap {
      background: var(--card); border-radius: 24px;
      padding: 26px 14px 16px; margin-bottom: 10px;
    }
    .pile {
      display: flex; flex-wrap: wrap-reverse; justify-content: center; align-content: flex-start;
      gap: 0 2px; min-height: 150px; max-width: 330px; margin: 0 auto;
      padding: 0 0 12px; border-bottom: var(--border-strong) solid #e6d6c3;
    }
    /* 크고 통통한 조약돌: 위는 밝게, 아래는 살짝 그늘지게 */
    .pebble {
      border: none; padding: 0; cursor: pointer; display: block;
      margin: -6px -1px;   /* 위아래·옆 조약돌이 살짝 포개지게 */
      box-shadow:
        inset -5px -7px 0 rgba(120, 66, 34, 0.10),
        inset 4px 5px 8px rgba(255, 255, 255, 0.25),
        0 3px 4px rgba(150, 95, 60, 0.12);
      transition: transform .2s ease;
    }
    .pebble:active { transform: translateY(-3px) rotate(var(--rot)) !important; }
    .pebble:focus-visible { outline: var(--border-strong) solid var(--soft); outline-offset: 2px; }
    /* 털어놓은 조약돌: 바닷가의 유리 조약돌처럼 뽀얗게 비치는 느낌.
       겹친 뒤쪽 돌이 비쳐 지저분해지지 않게, 바탕은 옅은 색으로 채우고 빛만 비치게 해요 */
    .pebble.vent {
      box-shadow:
        inset 0 0 4px 1px rgba(255, 255, 255, 0.45),   /* 가장자리 흰 빛: 선이 아니라 번지듯 부드럽게 */
        inset -4px -6px 10px rgba(214, 140, 96, 0.16),
        inset 3px 4px 10px rgba(255, 255, 255, 0.7),
        0 2px 5px rgba(150, 95, 60, 0.08);
    }
    .mini span.vent { box-shadow: inset 0 0 2px 0.5px rgba(255, 255, 255, 0.55); }
    .day li.vent { cursor: default; color: var(--soft); }
    .day li.vent:active { background: none; }
    .pebble.drop { animation: drop .55s cubic-bezier(.3, 1.4, .5, 1) both; }
    @keyframes drop {
      from { opacity: 0; transform: translateY(-40px) rotate(var(--rot)); }
      to   { opacity: 1; transform: translateY(0) rotate(var(--rot)); }
    }
    .pile-empty { color: var(--soft); text-align: center; font-size: 0.95rem; align-self: center; padding: 20px 8px; }
    .count { text-align: center; margin: 12px 0 0; font-size: 0.98rem; white-space: pre-line; }
    .caption { text-align: center; color: var(--soft); font-size: 0.88rem; min-height: 1.5em; margin: 4px 0 0; }

    /* 날마다 해낸 것 */
    h2 { font-size: 1.05rem; margin: 28px 0 8px; }
    .day { padding: 12px 2px; border-bottom: var(--border) solid var(--line); }
    .day-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .day-head strong { font-size: 0.98rem; }
    .day-head .today { font-size: 0.75rem; color: var(--accent-deep); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; }
    /* 그날의 날씨: 일기장 귀퉁이에 적는 것처럼 작게 */
    .weather { display: inline-flex; width: 22px; height: 22px; flex-shrink: 0; }
    .weather svg { width: 100%; height: 100%; }
    .mini { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; max-width: 50%; }
    .mini span { width: 13px; height: 10px; border-radius: 50%; }
    .day ul { list-style: none; padding: 0; margin: 0; }
    .day li {
      display: flex; gap: 10px; font-size: 0.95rem; padding: 6px 4px; margin: 0 -4px;
      border-radius: 8px; cursor: pointer;
    }
    .day li:active { background: var(--accent-soft); }
    .day li:focus-visible { outline: var(--border-strong) solid var(--soft); outline-offset: 1px; }
    .day li time { color: var(--soft); font-size: 0.85rem; min-width: 4.2em; padding-top: 1px; }
    .day li .memo { display: block; color: var(--soft); font-size: 0.85rem; }
    .day li .memo.hint { color: var(--faint); font-size: 0.8rem; }
    .quiet-note { color: var(--soft); font-size: 0.85rem; text-align: center; margin: 22px 0 0; }

    @media (prefers-reduced-motion: reduce) {
      .pebble.drop { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top fixed-bar">
      <a class="link" href="index.html" data-back>← 오늘 해낸 일</a>
      <span data-help-slot></span>
    </div>

    <h1>이번 주 돌아보기</h1>
    <p class="range" id="range"></p>

    <section class="pile-wrap" aria-label="이번 주에 쌓인 조약돌">
      <div class="pile" id="pile"></div>
      <p class="count" id="count"></p>
      <p class="caption" id="caption" role="status"></p>
    </section>

    <div id="days"></div>
  </main>

  <script src="help.js"></script>
  <script src="nav.js"></script>
  <script src="record-sheet.js"></script>
  <script src="mood.js"></script>
  <script>
    // 이 화면은 "오늘 해낸 일"에서 쌓은 기록을 보여 줘요.
    // 기록을 고치거나 빼는 일은 record-sheet.js의 작은 창에서만 해요.
    const KEY = "overcome.v1";
    const $ = (id) => document.getElementById(id);

    function load() {
      try {
        const data = JSON.parse(localStorage.getItem(KEY));
        if (data && Array.isArray(data.records)) return data;
      } catch (e) {}
      return { items: [], records: [] };
    }
    // 털어놓기를 마친 시간들 (vent.html이 남겨요. 글 내용은 없어요)
    const VENTED_KEY = "chagok.vented.v1";
    function loadVented() {
      try {
        const list = JSON.parse(localStorage.getItem(VENTED_KEY));
        if (Array.isArray(list)) return list.filter((v) => v && typeof v.at === "string");
      } catch (e) {}
      return [];
    }
    const VENT_NAME = "털어놓았어요";
    // 기분이 "비가 와요"인 날, 쉬어 가기로 한 시간 (홈이 남겨요. 내용은 없어요)
    const REST_KEY = "chagok.rest.v1";
    function loadRest() {
      try {
        const list = JSON.parse(localStorage.getItem(REST_KEY));
        if (Array.isArray(list)) return list.filter((v) => v && typeof v.at === "string");
      } catch (e) {}
      return [];
    }
    const REST_NAME = "쉬어 가기로 했어요";
    const REST_TONE = "#d9b89a";   // 쉬어 간 조약돌: 살구보다 모래에 가까운 뽀얀 색
    // 조약돌 색을 크림과 섞어 뽀얗게 만들어요 (amount: 원래 색이 남는 정도)
    const ventColor = (c, amount = 0.42) => {
      const n = parseInt(c.slice(1), 16), cream = [253, 248, 242];
      const ch = [n >> 16, (n >> 8) & 255, n & 255].map((v, i) => Math.round(v * amount + cream[i] * (1 - amount)));
      return `rgb(${ch.join(", ")})`;
    };
    const ventFill = (c) =>
      `radial-gradient(ellipse at 30% 26%, rgba(255,255,255,.85), rgba(255,255,255,0) 34%),` +
      `radial-gradient(ellipse at 72% 80%, rgba(255,255,255,.35), rgba(255,255,255,0) 30%),` +
      `linear-gradient(165deg, ${ventColor(c, 0.34)}, ${ventColor(c, 0.58)})`;

    // 이번 주: 월요일 0시부터 다음 주 월요일 0시 전까지 (내 기기 시간 기준)
    const now = new Date();
    const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
    const weekEnd = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 7);
    const dayKey = (d) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    const todayKey = dayKey(now);

    const fmtDay = (d) => d.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });
    const fmtShort = (d) => d.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
    const fmtTime = (d) => d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
    const lastDay = new Date(weekEnd.getTime() - 1);
    $("range").textContent = `${fmtShort(weekStart)} – ${fmtShort(lastDay)}`;


    // 조약돌 모양: 기록마다 정해진 모양이라, 다시 열어도 같은 조약돌이에요
    const COLORS = ["#e09a6b", "#e8a87c", "#eeb48c", "#f2c4a0"];   // theme.css의 --pebble-1~4와 같은 색
    function hash(str) {
      let h = 2166136261;
      for (const c of str) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }
    function pebbleLook(id) {
      const h = hash(id);
      const pick = (n, shift) => (h >>> shift) % n;
      const w = 50 + pick(14, 0);          // 50~63px: 크게
      const ht = 38 + pick(9, 4);          // 38~46px: 통통하게 (너비의 70~80%)
      const rot = pick(21, 8) - 10;        // -10~10도
      const color = COLORS[pick(COLORS.length, 13)];
      const a = 46 + pick(10, 16), b = 44 + pick(12, 20);
      return { w, ht, rot, color, radius: `${a}% ${100 - a}% ${b}% ${100 - b}% / ${56 + pick(8, 24)}% ${54 + pick(8, 26)}% ${44 - pick(6, 28)}% ${42 + pick(6, 29)}%` };
    }

    // 기록을 탭하면 "오늘 내가 해낸 것"과 같은 작은 창이 열려요.
    // 고치거나 뺀 뒤에는 조약돌이 다시 떨어지지 않고 조용히 바뀌어요.
    const openSheet = (id) => openRecordSheet(id, () => render(false));
    const tappable = (el, id) => {
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.addEventListener("click", () => openSheet(id));
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(id); } });
    };

    function render(animate) {
      const records = load().records
        .concat(loadVented().map((v) => ({ id: v.id, at: v.at, name: VENT_NAME, vent: true })))
        .concat(loadRest().map((v) => ({ id: v.id, at: v.at, name: REST_NAME, vent: true, rest: true })))
        .map((r) => ({ ...r, date: new Date(r.at) }))
        .filter((r) => r.date >= weekStart && r.date < weekEnd)
        .sort((a, b) => a.date - b.date);   // 먼저 해낸 것이 아래에 깔려요

      // 조약돌 쌓기
      const pile = $("pile");
      pile.innerHTML = "";
      if (records.length === 0) {
        pile.innerHTML = '<p class="pile-empty">작은 일 하나를 해내면<br>여기에 조약돌이 하나 놓여요.</p>';
        $("count").textContent = "";
        $("caption").textContent = "";
      } else {
        const totalDrop = Math.min(1400, records.length * 90);
        records.forEach((r, i) => {
          const look = pebbleLook(r.id);
          const p = document.createElement("button");
          p.type = "button";
          p.className = "pebble" + (r.vent ? " vent" : "") + (animate ? " drop" : "");
          p.style.width = look.w + "px";
          p.style.height = look.ht + "px";
          p.style.background = r.vent ? ventFill(r.rest ? REST_TONE : look.color)
            : `radial-gradient(circle at 32% 30%, rgba(255,255,255,.45), transparent 45%), ${look.color}`;
          p.style.borderRadius = look.radius;
          p.style.setProperty("--rot", look.rot + "deg");
          p.style.transform = `rotate(${look.rot}deg)`;
          if (animate) p.style.animationDelay = (records.length > 1 ? (i / (records.length - 1)) * totalDrop : 0) + "ms";
          p.setAttribute("aria-label", `${fmtShort(r.date)} ${fmtTime(r.date)} · ${r.name}`);
          // 털어놓은·쉬어 간 조약돌은 고칠 것이 없어서, 언제였는지만 조용히 알려 줘요
          p.addEventListener("click", () => r.vent
            ? ($("caption").textContent = `${fmtShort(r.date)} ${fmtTime(r.date)} · ` +
                (r.rest ? "쉬어 가기로 했어요." : "털어놓았어요. 그것도 해낸 거예요."))
            : openSheet(r.id));
          pile.appendChild(p);
        });
        const vents = records.filter((r) => r.vent && !r.rest).length;
        const rests = records.filter((r) => r.rest).length;
        const parts = [vents && `털어놓은 것 ${vents}개`, rests && `쉬어 간 것 ${rests}개`].filter(Boolean);
        $("count").textContent = `이번 주에 조약돌 ${records.length}개가 쌓였어요.` +
          (parts.length ? "\n" + parts.join(" · ").replace(/ (?=\d)/g, "\u00a0") : "");
        $("caption").textContent = "조약돌을 누르면 기록을 볼 수 있어요.";
      }

      // 날마다 해낸 것: 해낸 것이 있는 날만 보여 줘요 (빈 날은 따로 표시하지 않아요)
      const byDay = new Map();
      for (const r of records) {
        const k = dayKey(r.date);
        if (!byDay.has(k)) byDay.set(k, { date: r.date, list: [] });
        byDay.get(k).list.push(r);
      }
      // 그날 마지막으로 고른 날씨 (고르지 않은 날은 아무것도 없어요)
      const weatherByDay = new Map();
      for (const m of window.chagokMood.load().sort((a, b) => new Date(a.at) - new Date(b.at))) {
        weatherByDay.set(dayKey(new Date(m.at)), m.level);
      }

      const days = $("days");
      days.innerHTML = "";
      if (byDay.size > 0) {
        const h2 = document.createElement("h2");
        h2.textContent = "이번 주에 내가 해낸 것";
        days.appendChild(h2);
      }
      for (const [k, { date, list }] of byDay) {
        const box = document.createElement("div");
        box.className = "day";

        const head = document.createElement("div");
        head.className = "day-head";
        const title = document.createElement("strong");
        title.textContent = fmtDay(date);
        head.appendChild(title);
        if (weatherByDay.has(k)) {
          const level = weatherByDay.get(k);
          const w = document.createElement("span");
          w.className = "weather";
          w.setAttribute("role", "img");
          w.setAttribute("aria-label", "이날의 날씨: " + window.chagokMood.MOODS.find((x) => x.level === level).label);
          w.innerHTML = window.chagokMood.svg(level);
          head.appendChild(w);
        }
        if (k === todayKey) {
          const t = document.createElement("span");
          t.className = "today";
          t.textContent = "오늘";
          head.appendChild(t);
        }
        const mini = document.createElement("span");
        mini.className = "mini";
        mini.setAttribute("aria-hidden", "true");
        for (const r of list) {
          const s = document.createElement("span");
          const c = pebbleLook(r.id).color;
          s.style.background = r.vent ? ventColor(r.rest ? REST_TONE : c) : c;
          if (r.vent) s.className = "vent";
          mini.appendChild(s);
        }
        head.appendChild(mini);
        box.appendChild(head);

        // 기록 하나에 한 줄씩: 탭하면 메모를 쓰거나 고치고, 잘못 누른 기록은 뺄 수 있어요
        const ul = document.createElement("ul");
        for (const r of list) {
          const li = document.createElement("li");
          const t = document.createElement("time");
          t.textContent = fmtTime(r.date);
          const s = document.createElement("span");
          s.textContent = r.name;
          if (r.vent) {
            li.className = "vent";   // 털어놓은 기록은 이름과 시간뿐이에요
          } else {
            const m = document.createElement("span");
            m.className = "memo" + (r.memo ? "" : " hint");
            m.textContent = r.memo || "탭해서 한 줄 남기기";
            s.appendChild(m);
            tappable(li, r.id);
          }
          li.append(t, s);
          ul.appendChild(li);
        }
        box.appendChild(ul);
        days.appendChild(box);
      }
      // 이번 주에 지나간 날 중 기록이 없는 날이 있을 때만, 개수 없이 조용히 한마디
      const passedDays = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - weekStart) / 86400000) + 1;
      if (byDay.size > 0 && byDay.size < passedDays) {
        const note = document.createElement("p");
        note.className = "quiet-note";
        note.textContent = "쉬어 간 날도 이번 주의 일부예요.";
        days.appendChild(note);
      }
    }

    render(true);
  </script>
</body>
</html>
