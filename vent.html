<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>털어놓기</title>
  <style>
    :root {
      --bg: #faf6f0;
      --card: #ffffff;
      --text: #4a4038;
      --soft: #8c7f73;
      --faint: #c4b8ac;
      --accent: #e8a87c;
      --accent-soft: #fbe8da;
      --line: #eee5da;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.7;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      max-width: 560px; margin: 0 auto; min-height: 100%;
      display: flex; flex-direction: column;
      padding: 14px 18px 24px;
    }

    /* 위쪽: 아주 조용한 길잡이 */
    .top { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
    .link {
      border: none; background: none; color: var(--faint);
      font: inherit; font-size: 0.85rem; cursor: pointer; padding: 6px 2px;
      text-decoration: none;
    }
    .link:hover, .link:focus-visible { color: var(--soft); }

    /* 쓰는 곳 */
    .paper { position: relative; flex: 1; display: flex; margin-top: 8px; }
    textarea, .scatter {
      font: inherit; font-size: 1.1rem; line-height: 1.8; color: inherit;
      width: 100%; padding: 8px 2px; margin: 0;
      white-space: pre-wrap; word-break: break-word;
    }
    textarea {
      flex: 1; min-height: 60vh;
      border: none; outline: none; resize: none; background: transparent;
      caret-color: var(--accent);
    }
    .scatter { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    .scatter span { display: inline-block; white-space: pre; }

    /* 아래쪽 버튼들 */
    .actions {
      display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
      min-height: 52px; padding-top: 12px;
      transition: opacity .4s ease;
    }
    .actions[hidden] { display: none; }
    .btn {
      font: inherit; border-radius: 14px; padding: 12px 18px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); color: var(--text);
    }
    .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.quiet { border-color: transparent; background: none; color: var(--soft); }
    .fade-in { animation: fadeIn .5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* 다 쓴 뒤 잠깐 보이는 말 */
    .whisper {
      position: fixed; left: 0; right: 0; top: 42%;
      text-align: center; color: var(--soft); font-size: 1rem;
      opacity: 0; transition: opacity .8s ease; pointer-events: none;
    }
    .whisper.show { opacity: 1; }

    /* 간직한 글 */
    .kept[hidden], .write[hidden] { display: none; }
    .kept h1 { font-size: 1.2rem; margin: 12px 0 2px; }
    .kept .sub { color: var(--soft); font-size: 0.88rem; margin: 0 0 18px; }
    .kept ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .kept li {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 14px 16px 10px; position: relative;
    }
    .kept time { color: var(--soft); font-size: 0.82rem; }
    .kept .body { white-space: pre-wrap; word-break: break-word; margin: 6px 0 4px; }
    .kept .row { text-align: right; }
    .kept .empty { color: var(--soft); text-align: center; padding: 40px 12px; background: none; border: none; }
    .kept .scatter { position: absolute; }

    @media (prefers-reduced-motion: reduce) {
      .fade-in { animation: none; }
    }
  </style>
</head>
<body>
  <!-- 쓰기 -->
  <main class="write" id="writeView">
    <div class="top">
      <a class="link" href="index.html">← 오늘 해낸 일</a>
      <button class="link" id="showKept" type="button">간직한 글</button>
    </div>

    <div class="paper">
      <textarea id="text" aria-label="털어놓기" autofocus spellcheck="false"></textarea>
      <div class="scatter" id="scatter" aria-hidden="true"></div>
    </div>

    <div class="actions" id="doneRow" hidden>
      <button class="btn" id="doneBtn" type="button">다 썼어요</button>
    </div>
    <div class="actions" id="chooseRow" hidden>
      <button class="btn quiet" id="moreBtn" type="button">조금 더 쓸래요</button>
      <button class="btn" id="releaseBtn" type="button">흘려보내기</button>
      <button class="btn main" id="keepBtn" type="button">간직하기</button>
    </div>
  </main>

  <!-- 간직한 글 -->
  <main class="kept" id="keptView" hidden>
    <div class="top">
      <button class="link" id="backToWrite" type="button">← 털어놓기</button>
    </div>
    <h1>간직한 글</h1>
    <p class="sub">이 기기 안에만 있어요. 나만 볼 수 있어요.</p>
    <ul id="keptList"></ul>
  </main>

  <div class="whisper" id="whisper" role="status"></div>

  <script>
    // ── 간직한 글은 이 브라우저 안(localStorage)에만 저장돼요. 흘려보낸 글은 어디에도 남지 않아요. ──
    const KEY = "overcome.vent.v1";
    const $ = (id) => document.getElementById(id);
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function loadKept() {
      try {
        const data = JSON.parse(localStorage.getItem(KEY));
        if (Array.isArray(data)) return data;
      } catch (e) {}
      return [];
    }
    function saveKept(list) {
      try { localStorage.setItem(KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
    }
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    const text = $("text");

    // 글이 있을 때만 "다 썼어요"가 조용히 나타나요
    function updateButtons() {
      const has = text.value.trim().length > 0;
      if (!$("chooseRow").hidden) return;
      if (has && $("doneRow").hidden) { $("doneRow").hidden = false; $("doneRow").classList.add("fade-in"); }
      if (!has) $("doneRow").hidden = true;
    }
    text.addEventListener("input", updateButtons);

    $("doneBtn").addEventListener("click", () => {
      $("doneRow").hidden = true;
      $("chooseRow").hidden = false;
      $("chooseRow").classList.add("fade-in");
    });
    $("moreBtn").addEventListener("click", () => {
      $("chooseRow").hidden = true;
      updateButtons();
      text.focus();
    });

    function resetWriting() {
      text.value = "";
      text.style.visibility = "";
      text.readOnly = false;
      $("chooseRow").hidden = true;
      $("doneRow").hidden = true;
      $("scatter").innerHTML = "";
    }

    function whisper(msg, ms = 1800) {
      const w = $("whisper");
      w.textContent = msg;
      w.classList.add("show");
      return new Promise((res) => setTimeout(() => { w.classList.remove("show"); setTimeout(res, 600); }, ms));
    }

    // 간직하기
    $("keepBtn").addEventListener("click", async () => {
      const body = text.value.replace(/\s+$/, "");
      if (!body.trim()) return;
      const list = loadKept();
      list.unshift({ id: uid(), text: body, at: new Date().toISOString() });
      if (!saveKept(list)) { alert("지금은 저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요."); return; }
      $("chooseRow").hidden = true;
      text.readOnly = true;
      text.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: "forwards" }).finished
        .then(() => { resetWriting(); text.getAnimations().forEach((a) => a.cancel()); });
      await whisper("간직했어요. 나만 볼 수 있어요.");
      text.focus();
    });

    // 흘려보내기: 글자가 하나씩 흩어지며 사라져요
    function scatterText(str, layer, source) {
      layer.innerHTML = "";
      const chars = Array.from(str);
      // 아주 긴 글은 낱말 단위로 흩어요 (기기가 버벅이지 않게)
      const pieces = chars.length > 1200 ? str.split(/(\s+)/) : chars;
      const spans = [];
      for (const p of pieces) {
        if (p === "") continue;
        if (/^\s+$/.test(p)) { layer.appendChild(document.createTextNode(p)); continue; }
        const s = document.createElement("span");
        s.textContent = p;
        layer.appendChild(s);
        spans.push(s);
      }
      source.style.visibility = "hidden";
      if (reduceMotion) {
        return layer.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, fill: "forwards" }).finished;
      }
      const spread = Math.min(1400, 300 + spans.length * 12);
      const anims = spans.map((s, i) => {
        const dx = (Math.random() - 0.5) * 120;
        const dy = -(30 + Math.random() * 110);
        const rot = (Math.random() - 0.5) * 50;
        return s.animate(
          [
            { transform: "none", opacity: 1, filter: "blur(0)" },
            { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.8)`, opacity: 0, filter: "blur(4px)" },
          ],
          {
            duration: 1400 + Math.random() * 600,
            delay: (i / Math.max(1, spans.length)) * spread + Math.random() * 120,
            easing: "cubic-bezier(.3,.1,.3,1)",
            fill: "forwards",
          }
        ).finished;
      });
      return Promise.all(anims);
    }

    $("releaseBtn").addEventListener("click", async () => {
      $("chooseRow").hidden = true;
      text.readOnly = true;
      const str = text.value;
      text.value = "";                 // 글은 바로 비워요. 저장은 처음부터 하지 않아요.
      await scatterText(str, $("scatter"), text);
      resetWriting();
      await whisper("흘려보냈어요.");
      text.focus();
    });

    // 간직한 글 보기
    function renderKept() {
      const list = loadKept();
      const ul = $("keptList");
      ul.innerHTML = "";
      if (list.length === 0) {
        ul.innerHTML = '<li class="empty">아직 간직한 글이 없어요.</li>';
        return;
      }
      for (const item of list) {
        const li = document.createElement("li");
        const t = document.createElement("time");
        t.textContent = new Date(item.at).toLocaleString("ko-KR", {
          month: "long", day: "numeric", weekday: "short", hour: "numeric", minute: "2-digit",
        });
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = item.text;
        const layer = document.createElement("div");
        layer.className = "scatter body";
        const row = document.createElement("div");
        row.className = "row";
        const rel = document.createElement("button");
        rel.className = "link";
        rel.type = "button";
        rel.textContent = "이제 흘려보내기";
        rel.addEventListener("click", async () => {
          if (!confirm("이 글을 흘려보낼까요?\n흘려보내면 다시 볼 수 없어요.")) return;
          saveKept(loadKept().filter((x) => x.id !== item.id));
          rel.disabled = true;
          layer.style.top = body.offsetTop + "px";
          layer.style.left = body.offsetLeft + "px";
          layer.style.width = body.offsetWidth + "px";
          await scatterText(item.text, layer, body);
          await li.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: "forwards" }).finished;
          renderKept();
        });
        row.appendChild(rel);
        li.append(t, body, layer, row);
        ul.appendChild(li);
      }
    }

    $("showKept").addEventListener("click", () => {
      if (text.value.trim() && !confirm("지금 쓰던 글은 저장되지 않아요. 간직한 글을 보러 갈까요?")) return;
      resetWriting();
      renderKept();
      $("writeView").hidden = true;
      $("keptView").hidden = false;
      scrollTo(0, 0);
    });
    $("backToWrite").addEventListener("click", () => {
      $("keptView").hidden = true;
      $("writeView").hidden = false;
      text.focus();
    });

    // 쓰던 중에 페이지를 닫으려 하면 한 번 물어봐요
    addEventListener("beforeunload", (e) => {
      if (text.value.trim()) { e.preventDefault(); e.returnValue = ""; }
    });
  </script>
</body>
</html>
